<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Work Scripts</title>
<style>
  :root{
    --sidebar-bg:#1a2332; --sidebar-ink:#c7d0dc; --sidebar-active:#2563eb;
    --sidebar-hover:#233047; --bg:#f4f6f8; --line:#e2e8f0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg)}
  .layout{display:flex;height:100vh}
  .sidebar{width:260px;flex:none;background:var(--sidebar-bg);color:var(--sidebar-ink);
    display:flex;flex-direction:column;padding:18px 12px;transition:width .18s ease;overflow:hidden}
  .sidebar.collapsed{width:64px;padding:18px 8px}
  .sidebar-head{display:flex;align-items:center;gap:10px;padding:0 2px 20px}
  .sidebar.collapsed .sidebar-head{justify-content:center}
  .hamburger{flex:none;width:34px;height:34px;border:0;border-radius:8px;background:transparent;
    color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .hamburger:hover{background:var(--sidebar-hover)}
  .brand{color:#fff;overflow:hidden;white-space:nowrap}
  .brand h1{font-size:17px;margin:0 0 3px}
  .brand span{font-size:12px;color:#8794a8}
  .sidebar.collapsed .brand{display:none}
  .nav{display:flex;flex-direction:column;gap:6px}
  .nav-btn{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;
    border:0;border-radius:8px;padding:12px 12px;color:var(--sidebar-ink);font-size:14px;
    font-weight:600;cursor:pointer;transition:background .12s;overflow:hidden;white-space:nowrap}
  .sidebar.collapsed .nav-btn{justify-content:center;padding:12px 0}
  .nav-btn .icon{font-size:18px;width:22px;text-align:center;flex:none}
  .nav-btn:hover{background:var(--sidebar-hover)}
  .nav-btn.active{background:var(--sidebar-active);color:#fff}
  .nav-desc{font-size:11px;font-weight:400;color:#8794a8;margin-top:2px}
  .nav-btn.active .nav-desc{color:#dbe6ff}
  .sidebar.collapsed .nav-btn .label{display:none}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;
    font-size:15px;font-weight:700;color:#202124}
  .frame-wrap{flex:1;min-height:0}
  iframe{width:100%;height:100%;border:0;display:block}
  .placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:#8794a8;font-size:14px}
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="hamburger" id="hamburger" title="Collapse/expand menu" aria-label="Toggle menu">☰</button>
      <div class="brand">
        <h1>Office Work Scripts</h1>
        <span>Internal automation tools</span>
      </div>
    </div>
    <div class="nav" id="nav">
      <button class="nav-btn" data-src="tools/excel-to-pdf.html" data-title="Smart Excel to PDF Converter" title="Smart Excel to PDF Converter">
        <span class="icon">📄</span>
        <span class="label">Excel to PDF Converter
          <div class="nav-desc">Convert workbooks to formatted PDF</div>
        </span>
      </button>
      <button class="nav-btn" data-src="tools/pdf-table-extractor.html" data-title="PDF PO &amp; Service Order Table Extractor" title="PDF PO &amp; Service Order Table Extractor">
        <span class="icon">📊</span>
        <span class="label">PDF Table Extractor
          <div class="nav-desc">Extract PO / service order tables to Excel</div>
        </span>
      </button>
      <button class="nav-btn" data-src="tools/pdf-merger/index.html" data-title="PDF Merger with Index" title="PDF Merger with Index">
        <span class="icon">📚</span>
        <span class="label">PDF Merger with Index
          <div class="nav-desc">Merge PDFs into one file with a linked index</div>
        </span>
      </button>
      <button class="nav-btn" data-src="tools/excel-version-comparator.html" data-title="Excel Version Comparator" title="Excel Version Comparator">
        <span class="icon">🔀</span>
        <span class="label">Excel Version Comparator
          <div class="nav-desc">Compare 2-3 workbook versions, highlight changes</div>
        </span>
      </button>
      <button class="nav-btn" data-src="tools/file-renamer.html" data-title="OneDrive Master File Renamer" title="OneDrive Master File Renamer">
        <span class="icon">🗂️</span>
        <span class="label">Master File Renamer
          <div class="nav-desc">Copy &amp; rename files per company</div>
        </span>
      </button>
      <button class="nav-btn active" data-src="tools/folder-copier.html" data-title="Folder &amp; File Company Copier" title="Folder &amp; File Company Copier">
        <span class="icon">📁</span>
        <span class="label">Folder &amp; File Copier
          <div class="nav-desc">Duplicate folder + files per company</div>
        </span>
      </button>
    </div>
  </div>
  <div class="main">
    <div class="topbar" id="topbar">Folder &amp; File Company Copier</div>
    <div class="frame-wrap">
      <iframe id="appFrame" src="tools/folder-copier.html"></iframe>
    </div>
  </div>
</div>
<script>
"use strict";
const nav = document.getElementById("nav");
const frame = document.getElementById("appFrame");
const topbar = document.getElementById("topbar");
const sidebar = document.getElementById("sidebar");
const hamburger = document.getElementById("hamburger");

nav.addEventListener("click", (e) => {
  const btn = e.target.closest(".nav-btn");
  if (!btn) return;
  nav.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  frame.src = btn.dataset.src;
  topbar.textContent = btn.dataset.title;
});

function setCollapsed(collapsed) {
  sidebar.classList.toggle("collapsed", collapsed);
  try { localStorage.setItem("sidebarCollapsed", collapsed ? "1" : "0"); } catch (e) {}
}
hamburger.addEventListener("click", () => {
  setCollapsed(!sidebar.classList.contains("collapsed"));
});
try {
  // Collapsed by default; only stays expanded if the user explicitly expanded it before.
  setCollapsed(localStorage.getItem("sidebarCollapsed") !== "0");
} catch (e) {
  setCollapsed(true);
}
</script>
</body>
</html>
