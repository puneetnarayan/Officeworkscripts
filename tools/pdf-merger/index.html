<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Merger with Index</title>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"Segoe UI",Arial,sans-serif;background:#f7f3f8;color:#403946;padding:28px 14px}
.app{max-width:1000px;margin:auto;background:#fff;border:2px solid #d9cfe0;border-radius:20px;padding:28px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
h1{text-align:center;color:#5c4b66;margin:0 0 8px}.sub{text-align:center;color:#777;margin-bottom:24px}
.drop{border:2px dashed #b8a7c5;background:#f3eafa;border-radius:16px;padding:38px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:16px}.drop:hover,.drop.over{background:#e7f2ec;border-color:#6e9c82}
.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}button{border:0;border-radius:10px;padding:11px 18px;cursor:pointer;font-size:15px;transition:.2s;box-shadow:0 3px 7px #0001}button:hover{transform:translateY(-2px);filter:brightness(.92)}button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.add{background:#dceefc}.clear{background:#f9dddd}.merge{background:#dcefdc;font-weight:700;font-size:16px}.list{display:flex;flex-direction:column;gap:9px}.empty{padding:25px;text-align:center;color:#999;background:#faf7fb;border:1px dashed #d7ccd9;border-radius:12px}
.item{display:flex;align-items:center;gap:12px;padding:12px;background:#faf7fb;border:1px solid #e3dce7;border-radius:12px;cursor:grab}.item.dragging{opacity:.45}.handle{font-size:22px;color:#806a8b;width:26px;text-align:center}.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#eadff0;font-weight:bold}.info{flex:1;min-width:0}.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.size{font-size:12px;color:#888;margin-top:4px}.delete{background:#f8dcdc;padding:8px 12px}.note{font-size:13px;color:#7a7080;margin:12px 0}.status{text-align:center;min-height:25px;margin-top:16px;font-weight:600}.ok{color:#39734b}.err{color:#b34747}.work{color:#6b5b88}
@media(max-width:650px){.app{padding:18px}.item{flex-wrap:wrap}.delete{margin-left:auto}}
</style></head><body><div class="app">
<h1>📚 PDF Merger with Index</h1><div class="sub">Drag files to add them. Drag rows to change merge order.</div>
<div id="drop" class="drop"><div style="font-size:46px">📂</div><b>Drag & Drop PDF Files Here</b><div style="margin-top:7px;color:#777;font-size:14px">or click to select multiple PDFs</div></div>
<input id="input" type="file" accept=".pdf,application/pdf" multiple hidden>
<div class="controls"><button id="add" class="add">➕ Add PDF Files</button><button id="clear" class="clear">🗑 Clear All</button><button id="merge" class="merge">🔗 Create Indexed PDF</button></div>
<h2 style="font-size:19px;color:#5c4b66">Merge Order</h2><div class="note">Files initially sort by prefixes such as 1_, 2_, 3_. You can then drag any row to a new position.</div>
<div id="list" class="list"><div class="empty">No PDF files added yet.</div></div><div id="status" class="status"></div>
</div><script src="script.js"></script></body></html>
